<!DOCTYPE html>
<html>
<head>
    <title>Basement Monitor</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #1a1a1a;
    color: #ececec;
    font-family: 'Segoe UI', sans-serif;
    padding: 40px;
}

h1 {
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 30px;
    color: #ffffff;
    text-align: center;
}

.cards {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
}

.card {
    background-color: #2a2a2a;
    padding: 24px 32px;
    border-radius: 12px;
    font-size: 1.2rem;
    flex: 1;
    text-align: center;
}

.chart-conatiner {
	width: 100%;
	margin: 0 auto;
}

.chart-container canvas {
	width: 100% !important;
	height: 400px !important;
}
</style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Basement Monitor</h1>
<div class="cards">
    <div class="card" id="temperature">Temperature: --°F</div>
    <div class="card" id="humidity">Humidity: --%</div>
</div>
<div class="chart-container">
	<canvas id="chart"></canvas>
</div>

<script>
	const ctx = document.getElementById('chart').getContext('2d');
	const myChart = new Chart(ctx, {
		type: 'line',
		data: {
			labels: [],
			datasets: [{
				label: 'Temperature (°F)',
				data: [],
				borderColor: 'rgb(255, 99, 132)',
				tension: 0.1
			},
				{
    				label: 'Humidity (%)',
    				data: [],
    				borderColor: 'rgb(99, 132, 255)',
    				tension: 0.1
			}]
		},
		options: {
			responsive: true,
			maintainAspectRatio: false,
        plugins: {
            legend: {
                labels: {
                    color: '#ececec'
                }
            }
        },
        scales: {
            x: {
                ticks: { color: '#ececec' },
                grid: { color: '#333333' }
            },
            y: {
                ticks: { color: '#ececec' },
                grid: { color: '#333333' }
            }
        }
    }
	});


	function fetchData() {
		fetch('/api/data')
			.then(response => response.json())
			.then(data => {
				document.getElementById('temperature').innerText = 'Temperature: ' + data[data.length - 1][2] + '°F'
				document.getElementById('humidity').innerText = 'Humidity: ' + data[data.length - 1][3] + '%'

				myChart.data.labels = data.map(row => {
    					const d = new Date(row[1]);
    					return d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
				});
				myChart.data.datasets[0].data = data.map(row => row[2]);
				myChart.data.datasets[1].data = data.map(row => row[3]);
				myChart.update();
			})
			.catch(error => console.log(error))
	}

	fetchData();
	setInterval(fetchData, 30000);
</script>

</body>
</html>
