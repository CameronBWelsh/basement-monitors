<!DOCTYPE html>
<html>
<head>
    <title>Basement Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Basement Monitor</h1>
<div id="temperature">Temperature: --°F</div>
<div id="humidity">Humidity: --%</div>
<canvas id="chart"></canvas>

<script>
	function fetchData() {
		fetch('/api/data')
			.then(response => response.json())
			.then(data => {
				document.getElementById('temperature').innerText = 'Temperature: ' + data[data.length - 1][2] + '°F'
				document.getElementById('humidity').innerText = 'Humidity: ' + data[data.length - 1][3] + '%'
			}
	}

	fetchData();
	setInterval(fetchData, 30000);
</script>

</body>
</html>
