<!DOCTYPE html>
<html>
<head>
    <title>Basement Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Basement Monitor</h1>
<div id="temperature">Temperature: --°F</div>
<div id="humidity">Humidity: --%</div>
<canvas id="chart"></canvas>

<script>
	const ctx = document.getElementById('chart').getContext('2d');
	const myChart = new Chart(ctx, {
		type: 'line',
		data: {
			labels: [],
			datasets: [{
				label: 'Temperature (°F)',
				data: [],
				borderColor: 'rgb(255, 99, 132)',
				tension: 0.1
			}]
		}
	});


	function fetchData() {
		fetch('/api/data')
			.then(response => response.json())
			.then(data => {
				document.getElementById('temperature').innerText = 'Temperature: ' + data[data.length - 1][2] + '°F'
				document.getElementById('humidity').innerText = 'Humidity: ' + data[data.length - 1][3] + '%'

				myChart.data.labels = data.map(row => row[1]);
				myChart.data.datasets[0].data = data.map(row => row[2]);
				myChart.update();
			})
			.catch(error => console.log(error))
	}

	fetchData();
	setInterval(fetchData, 30000);
</script>

</body>
</html>
